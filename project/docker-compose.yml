services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: watershed-backend:local
    container_name: watershed-api-server
    ports:
      - "8000:8080"
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - PYTHONUNBUFFERED=1
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
